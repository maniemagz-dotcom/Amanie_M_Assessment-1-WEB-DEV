<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"> <!-- This specifies the character encoding for the document -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This meta tag is used to control the layout on mobile browsers. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@400;700&family=Workbench&display=swap" rel="stylesheet">
        <title>The Classic Three</title> <!-- This is the title of page seen on the broswer's tab -->
        <style>
            p,a,body {
                font-family: 'Quattrocento', serif;
                font-size: 15px;
                color: #333;
                margin: 5px 0;
            }
            body {
                background-color: rgb(212, 191, 162);
            }
            h1 {
                font-family: 'Quattrocento', serif;
                font-size: 30px;
                color: #333;
                margin: 20px 0;
                text-align: center;
            }
            img {
                filter: grayscale(30%) brightness(1.5) contrast(1);
                margin: 10px;
                border: 2px solid #ccc;
                border-radius: 8px;
            }
            .pic-content {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
            .pic-card {
                padding: 5px;
                border-radius: 5px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>The Classic Three</h1>
        <div class="pic-content">
            <div class="pic-card">
                <img src="images-3/classic-porsche.jpg" alt="Classic Porsche" width="400" height="auto" title="Photo by George Blatchford"> <!-- This is an image tag for displaying the first image -->
                <p>Classic Porsche<br> Photo by 
                    <a href="https://www.pexels.com/@george-blatchford-2159158855/" target="_blank">George Blatchford</a>
                    <a href="https://www.pexels.com/photo/classic-red-sports-car-parked-outdoors-in-sunshine-35849577/" target="_blank">| Pexels License (Free to Use)</a>
                </p>
            </div>

            <div class="pic-card">
                <img src="images-3/classic-mini-cooper.jpg" alt="Classic Mini Cooper" width="400" height="auto" title="Photo by Diana"> <!-- This is an image tag for displaying the second image -->
                <p>Classic Mini Cooper<br> Photo by 
                    <a href="https://www.pexels.com/@didsss/" target="_blank">Diana</a>
                    <a href="https://www.pexels.com/photo/retro-car-racing-in-city-5660828/" target="_blank">| Pexels License (Free to Use)</a>
                </p>
            </div>

            <div class="pic-card">
                <img src="images-3/classic-ford-mustang.jpg" alt="Classic Ford Mustang" width="400" height="auto" title="Photo by Garret Shields"> <!-- This is an image tag for displaying the third image -->
                <p>Classic Ford Mustang<br> Photo by 
                    <a href="https://www.pexels.com/@garret-shields-1929773013/" target="_blank">Garret Shields</a> 
                    <a href="https://www.pexels.com/photo/vintage-ford-mustang-racecar-display-in-tulsa-29067154/" target="_blank">| Pexels License (Free to Use)</a>
                </p>
            </div>
        </div>
    </body>
</html>
