<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- This specifies the character encoding for the document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Video</title> 

    <!-- CSS styles for the whole page -->

    <style>
        /* CSS styles for the VT323 font via @font-face, footer, video element and body section*/
        @font-face {
            font-family: 'VT323';
            src: url(video-image-text/VT323-Regular.ttf) format('truetype');
        }
        footer {
            margin: 0;
            color: white;
            text-align: center;
            font-family: 'VT323';
            font-size: 20px;
        }
        body {
            background-color: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        video {
            background-color: black;
        }
    </style>
</head>
<body>
    <video loop width="560" height="315" poster="video-image-text/poster.png" controls> <!-- Video with thumbnail (poster attribute) that loops -->
        <source src="video-image-text/video-arduino.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <footer><p>Embedding a Video</p></footer> <!-- Footer for the page -->
</body>
</html>
