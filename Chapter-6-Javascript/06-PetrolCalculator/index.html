<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h2>Welcome to Petrol Calculator!</h2>
    <!-- Input field for Cost per litre-->
    <label for="cost">Cost per litre ($):</label>
    <input type="number" id="cost" value="1.72">

    <!-- Input field for Number of litres-->
    <label for="number">Number of litres:</label>
    <input type="number" id="number" value="0">
    
    <!-- Button for Total cost-->
    <button onclick="calculate()">Calculate</button>
    <p id="total">Total cost: $0.00</p>

    <!-- Connecting JavaScript file for calculation -->
    <script src="script.js"></script>
</body>
</html>
